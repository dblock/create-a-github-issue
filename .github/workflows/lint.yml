name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code and Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Source
        uses: actions/checkout@v7
      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
