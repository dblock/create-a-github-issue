name: Publish

on:
  release:
    types: [published, edited]

jobs:
  build:
    name: Build and Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check Out Release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Install Dependencies
        run: npm ci
      - name: Build Action
        run: npm run build
      - name: Commit Build and Update Tags
        # Commits action.yml and all of dist/, including ncc chunks, and moves the release, vX.Y, and vX tags.
        uses: actions/github-script@v9
        with:
          script: |
            const { default: publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-release.mjs`)
            await publishRelease({ github, context, core, workspace: process.env.GITHUB_WORKSPACE })
